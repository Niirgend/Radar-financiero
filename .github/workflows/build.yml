name: Compilar APK con Buildozer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Compilar APK con Buildozer
        uses: kivy/buildozer-action@master
        with:
          filename: buildozer.spec

      - name: Subir artefacto (APK)
        uses: actions/upload-artifact@v4
        with:
          name: paquete-apk
          path: bin/*.apk
